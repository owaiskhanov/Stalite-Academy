    <!-- Structured Data: FAQPage -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",

          {
            "@type": "Question",
            "name": "How does the weekend schedule work?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Classes run on Saturdays and Sundays. The Basics curriculum lists 12 lectures of 2 hours 30 minutes each, for 30 learning hours. Contact the team to confirm the current schedule, batch dates and exact timings."
            }
          },
          {
            "@type": "Question",
            "name": "I’m new to digital marketing. Where will I start?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "The Basics curriculum starts with foundational topics: social media profiles, ad account creation, keyword research, web fundamentals and prompting AI tools. If you’re unsure whether the course matches your experience, talk to the team before enrolling."
            }
          },
          {
            "@type": "Question",
            "name": "Which marketing platforms will I learn about?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "The curriculum covers Google Business Profile, YouTube, Facebook, Instagram, LinkedIn, X, email, SMS and affiliate marketing. You’ll also learn Meta Ads, Google Ads, SEO and AISO."
            }
          },
          {
            "@type": "Question",
            "name": "Will I actually learn to build with AI?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Basics includes website fundamentals, prompt engineering, building websites with Antigravity or AI agents, databases, deployment and hosting."
            }
          },
          {
            "@type": "Question",
            "name": "What are the fees and how do I enrol?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Message Stalite Academy on WhatsApp or call +91 98606 85430 for the current fees, enrolment process and available batches. These details are confirmed directly by the team."
            }
          },
          {
            "@type": "Question",
            "name": "Are classes online or in person?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Please confirm the class format with the team for your chosen batch. The published schedule is Saturdays and Sundays, but the delivery format and exact timings have not been announced on this page."
            }
          },
          {
            "@type": "Question",
            "name": "Does the course include certification or placement?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "The curriculum includes certification prep, freelancing and agency pricing. Please confirm certificate eligibility, any external exam fees and career support directly with the team before enrolling. No placement guarantee is advertised."
            }
          }
        ]
      }
    </script>
