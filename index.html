    <!-- Structured Data: FAQPage -->

            "@type": "Question",
            "name": "How does the weekend schedule work?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Classes run on Saturdays and Sundays over 3 months. Each lecture is 2 hours 30 minutes (150 minutes), with 24 lectures in total. That adds up to 60 learning hours. Contact the team for the next batch dates and exact class timings."
            }
          },
          {
            "@type": "Question",
            "name": "What is the difference between Basics and Advanced?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Each phase has 12 lectures and 1,800 minutes of learning across the same three modules: Social Media Marketing, Performance Marketing and Search, and AI Powered Website and Web App Development. Basics establishes the foundations; Advanced goes deeper into campaigns, search and development."
            }
          },
          {
            "@type": "Question",
            "name": "I’m new to digital marketing. Where will I start?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "The Basics phase starts with foundational topics: social media profiles, ad account creation, keyword research, web fundamentals and prompting AI tools. If you’re unsure whether the course matches your experience, talk to the team before enrolling."
            }
          },
          {
            "@type": "Question",
            "name": "Which marketing platforms will I learn about?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "The curriculum covers Google Business Profile, YouTube, Facebook, Instagram, LinkedIn, X, email, SMS and affiliate marketing. You’ll also learn Meta Ads, Google Ads, SEO, AISO and Google Search Console."
            }
          },
          {
            "@type": "Question",
            "name": "Will I actually learn to build with AI?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Basics includes web fundamentals, prompting AI tools and building websites with Antigravity. Advanced covers responsive front ends, Google Cloud, Firebase, OAuth, storage, Supabase, dashboards and data visualisation."
            }
          },
          {
            "@type": "Question",
            "name": "What are the fees and how do I enrol?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Message Stalite Academy on WhatsApp or call +91 98606 85430 for the current fees, enrolment process and available batches. These details are confirmed directly by the team."
            }
          },
          {
            "@type": "Question",
            "name": "Are classes online or in person?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Please confirm the class format with the team for your chosen batch. The published schedule is Saturdays and Sundays, but the delivery format and exact timings have not been announced on this page."
            }
          },
          {
            "@type": "Question",
            "name": "Does the course include certification or placement?",
            "acceptedAnswer": {
              "@type": "Answer",
